services:
  postgres:
    image: postgres:16-alpine
    container_name: smartps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: SmartPS
      POSTGRES_USER: smartps
      POSTGRES_PASSWORD: smartps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartps -d SmartPS"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

